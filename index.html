<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wishlist Lucas Noël 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090f;
    --panel: rgba(255,255,255,.04);
    --panel-hover: rgba(255,255,255,.07);
    --border: rgba(255,255,255,.08);
    --text: #e8ecf3;
    --muted: #8a93a6;
    --red: #ff4d5e;
    --green: #3ddc97;
    --gold: #ffc857;
    --accent: linear-gradient(135deg, #ff4d5e, #ffc857);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'Space Grotesk', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2;
    background:
      radial-gradient(600px 400px at 15% 0%, rgba(255,77,94,.18), transparent 70%),
      radial-gradient(700px 500px at 90% 20%, rgba(61,220,151,.12), transparent 70%),
      radial-gradient(800px 600px at 50% 110%, rgba(255,200,87,.08), transparent 70%);
  }
  body::after { /* grille subtile */
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
    opacity: .5;
  }
  #snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  .wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 56px 16px 80px; }

  /* Header */
  .prompt { font-family: var(--mono); font-size: 13px; color: var(--green); margin-bottom: 14px; }
  .prompt .cursor { display: inline-block; width: 8px; height: 15px; background: var(--green); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  h1 { font-size: clamp(40px, 7vw, 76px); line-height: 1; letter-spacing: -0.03em; font-weight: 700; }
  h1 .grad { background: var(--accent); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--muted); margin-top: 14px; font-size: 17px; max-width: 560px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 36px 0 28px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; backdrop-filter: blur(10px); }
  .stat .label { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .stat .value { font-size: 28px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .stat .value small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 2px; }
  .bar { height: 4px; background: var(--border); border-radius: 4px; margin-top: 10px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .6s cubic-bezier(.2,.8,.2,1); }

  /* Toolbar */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 22px; position: sticky; top: 10px; z-index: 5;
    background: rgba(7,9,15,.7); backdrop-filter: blur(14px); border: 1px solid var(--border); border-radius: 14px; padding: 10px; }
  .search { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; }
  .search input { flex: 1; background: none; border: 0; outline: 0; color: var(--text); font: 15px var(--sans); padding: 10px 0; min-width: 0; }
  kbd { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font: 500 13px var(--sans); color: var(--muted); background: transparent; border: 1px solid var(--border); border-radius: 999px; padding: 7px 13px; cursor: pointer; transition: .2s; }
  .chip:hover { color: var(--text); border-color: rgba(255,255,255,.2); }
  .chip.active { color: #0b0d12; background: var(--text); border-color: var(--text); }
  select.sort { font: 13px var(--mono); color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px; cursor: pointer; }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), background .25s, border-color .25s; animation: pop .5s both; overflow: hidden; }
  .card:hover { transform: translateY(-4px); background: var(--panel-hover); border-color: rgba(255,255,255,.16); }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(400px circle at var(--mx, 50%) var(--my, 0%), rgba(255,200,87,.10), transparent 40%); opacity: 0; transition: opacity .3s; }
  .card:hover::before { opacity: 1; }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } }
  .ready .card { animation: none; }
  .card.taken { opacity: .55; }
  .card.taken .title { text-decoration: line-through; text-decoration-color: var(--red); }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .emoji { font-size: 34px; width: 58px; height: 58px; display: grid; place-items: center; background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 16px; }
  .prio { font-family: var(--mono); font-size: 11px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
  .prio.p1 { color: var(--red); background: rgba(255,77,94,.12); }
  .prio.p2 { color: var(--gold); background: rgba(255,200,87,.12); }
  .prio.p3 { color: var(--green); background: rgba(61,220,151,.12); }
  .title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .desc { color: var(--muted); font-size: 14px; line-height: 1.5; flex: 1; }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .tag { border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; }
  .price { font-family: var(--sans); font-size: 20px; font-weight: 700; color: var(--text); }
  .actions { display: flex; gap: 8px; }
  .btn { flex: 1; display: inline-flex; justify-content: center; align-items: center; gap: 6px; font: 600 14px var(--sans); padding: 11px 12px; border-radius: 12px; cursor: pointer; text-decoration: none; transition: .2s; border: 1px solid var(--border); color: var(--text); background: transparent; }
  .btn:hover { background: rgba(255,255,255,.06); }
  .btn.primary { background: var(--text); color: #0b0d12; border-color: var(--text); }
  .btn.primary:hover { filter: brightness(.9); }
  .btn.undo { color: var(--green); border-color: rgba(61,220,151,.35); }
  .empty { grid-column: 1/-1; text-align: center; padding: 60px 0; color: var(--muted); font-family: var(--mono); }

  footer { margin-top: 56px; text-align: center; font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 120px); background: var(--text); color: #0b0d12; font-weight: 600; padding: 12px 18px; border-radius: 12px; transition: transform .35s cubic-bezier(.2,.8,.2,1); z-index: 20; max-width: calc(100% - 32px); }
  .toast.show { transform: translate(-50%, 0); }

  @media (max-width: 600px) { .wrap { padding-top: 36px; } .toolbar { position: static; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } #snow { display: none; } }
</style>
</head>
<body>
<canvas id="snow"></canvas>

<div class="wrap">
  <header>
    <div class="prompt">~/noel $ santa --list --year=2026 <span class="cursor"></span></div>
    <h1>Ma wishlist<br><span class="grad">de Noël.</span></h1>
    <p class="sub">Quelques idées si vous êtes en panne d'inspiration. Pensez à vous coordonner entre vous pour éviter les doublons 🎁</p>
  </header>

  <section class="stats">
    <div class="stat"><div class="label">⏳ Jour J dans</div><div class="value" id="countdown">–</div></div>
    <div class="stat"><div class="label">🎁 Idées</div><div class="value" id="statCount">0</div></div>
    <div class="stat"><div class="label">💶 Budget total</div><div class="value" id="statBudget">0</div></div>
  </section>

  <div class="toolbar">
    <label class="search">
      <span>🔍</span>
      <input id="q" type="search" placeholder="Rechercher un cadeau…" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="chips" id="chips"></div>
    <select class="sort" id="sort" aria-label="Trier">
      <option value="prio">↓ priorité</option>
      <option value="price-asc">↑ prix</option>
      <option value="price-desc">↓ prix</option>
    </select>
  </div>

  <main class="grid" id="grid"></main>

  <footer>built with ❤️ &amp; ☕ — <span id="year"></span></footer>
</div>

<script>
/* ============================================================
   ✏️  TA LISTE — modifie simplement ce tableau
   prio : 1 = très envie, 2 = envie, 3 = bonus
   ============================================================ */
const WISHES = [
  { id: "rdp",   emoji: "🥍", title: "Raquette de Padel", desc: "Pour éviter de payer 3€ à chaque séance. Prenez sur Vinted c'est moins cher et ça me gène pas d'avoir une d'occasion si elle est en bonne état! Kuikma (Decathlon) très bon rapport qualité prix", price: 50, cat: "Sport",   prio: 1, url: "" },
  { id: "cdp",    emoji: "👟", title: "Chaussure de Padel/Tennis Taille 43", desc: "Pour venir accompagner ma potentielle raquette et éviter de me faire mal avec des chaussures bas de gamme. (Je veux pas des chaussures de running hein).Des Asics ou autre", price: 50, cat: "Sport",   prio: 2, url: "" },
  { id: "blpc",    emoji: "🔦", title: "Barre lumineuse pour écran",desc: "Pour éclairer mon écran et bon bureau le soir, moins agréssif que les ampoules je trouve.",     
  price: 70, cat: "Tech",   prio: 2, url: "" },
  { id: "mmy",   emoji: "⚽", title: "Maillot Mystère",  desc: "J'aime bien le principe, c'est là que j'ai eu mon maillot bleu que maman aime beaucoup. Oubliez pas de bannir Rennes et le Réal de Madrid (le site le permet à l'achat)",               price: 30,  cat: "Sport",  prio: 1, url: "" },
  { id: "bn",  emoji: "📔", title: "Book Nook",            desc: "Ce n'est pas un livre hein ! C'est une sorte de Légo pour adulte, j'en ai déjà fait 2, donc ne prenez pas le, mais je vous laisse choisir celui que vous voulez m'offrir !",                price: 60,  cat: "Loisir",    prio: 2, url: "" },
  { id: "trt",   emoji: "🛴", title: "Bon d'achat pour une trotinette électrique", desc: "Mon abonnement transport passe de 25€ à 56€ en mars 2027, je suis vieux 😭",      price: 350,  cat: "Loisir",    prio: 2, url: "" },
  { id: "etrt",   emoji: "🪖", title: "Equipements trotinette électrique", desc: "Toute sorte d'équipement qui pourrait m'être utiles (casque, gant, support téléphone etc..)",      price: 100,  cat: "Loisir",    prio: 2, url: "" },
  { id: "chlt",   emoji: "🍫", title: "Chocolats", desc: "Obligatoire c'est la magie de Nöel !",      
  price: 20,  cat: "Chocolat",    prio: 1, url: "" },
];
const CHRISTMAS = new Date(2026, 11, 25);
/* ============================================================ */

let filter = "Tous", query = "", sort = "prio";

const $ = id => document.getElementById(id);
const euro = n => n.toLocaleString("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const PRIO = { 1: ["p1", "🔥 très envie"], 2: ["p2", "★ envie"], 3: ["p3", "+ bonus"] };

function renderChips() {
  const cats = ["Tous", ...new Set(WISHES.map(w => w.cat))];
  $("chips").innerHTML = cats.map(c => `<button class="chip ${c === filter ? "active" : ""}" data-cat="${c}">${c}</button>`).join("");
}

function render() {
  const q = query.trim().toLowerCase();
  let items = WISHES.filter(w =>
    (filter === "Tous" || w.cat === filter) &&
    (!q || (w.title + " " + w.desc + " " + w.cat).toLowerCase().includes(q)));
  items.sort((a, b) =>
    sort === "price-asc" ? a.price - b.price :
    sort === "price-desc" ? b.price - a.price :
    a.prio - b.prio || a.price - b.price);

  $("grid").innerHTML = items.length ? items.map((w, i) => {
    const [cls, label] = PRIO[w.prio] || PRIO[3];
    return `
    <article class="card" style="animation-delay:${i * 40}ms">
      <div class="top"><div class="emoji">${w.emoji}</div><span class="prio ${cls}">${label}</span></div>
      <div><div class="title">${w.title}</div></div>
      <p class="desc">${w.desc}</p>
      <div class="meta"><span class="tag">#${w.cat.toLowerCase()}</span><span class="price">~${euro(w.price)}</span></div>
      ${w.url ? `<div class="actions"><a class="btn primary" href="${w.url}" target="_blank" rel="noopener">Voir le produit ↗</a></div>` : ""}
    </article>`;
  }).join("") : `<div class="empty">404 — aucun cadeau trouvé ¯\\_(ツ)_/¯</div>`;

  $("statCount").textContent = WISHES.length;
  $("statBudget").textContent = euro(WISHES.reduce((s, w) => s + w.price, 0));
}

function countdown() {
  const ms = CHRISTMAS - new Date();
  if (ms <= 0) { $("countdown").textContent = "🎄 C'est Noël !"; return; }
  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60;
  $("countdown").innerHTML = `${d}<small>j</small> ${h}<small>h</small> ${String(m).padStart(2, "0")}<small>m</small>`;
}

// Events
$("chips").addEventListener("click", e => { const c = e.target.dataset.cat; if (c) { filter = c; renderChips(); render(); } });
$("q").addEventListener("input", e => { query = e.target.value; render(); });
$("sort").addEventListener("change", e => { sort = e.target.value; render(); });
$("grid").addEventListener("pointermove", e => {
  const card = e.target.closest(".card"); if (!card) return;
  const r = card.getBoundingClientRect();
  card.style.setProperty("--mx", e.clientX - r.left + "px");
  card.style.setProperty("--my", e.clientY - r.top + "px");
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape") { $("q").value = ""; query = ""; render(); $("q").blur(); }
});

// Neige
(function snow() {
  const c = $("snow"), ctx = c.getContext("2d");
  let W, H, flakes = [];
  const resize = () => {
    W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio;
    c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
    flakes = Array.from({ length: Math.min(120, innerWidth / 10) }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.8 + .4) * devicePixelRatio,
      s: Math.random() * .6 + .2, d: Math.random() * Math.PI * 2 }));
  };
  const tick = () => {
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = "rgba(255,255,255,.7)";
    for (const f of flakes) {
      f.y += f.s * devicePixelRatio; f.d += .01; f.x += Math.sin(f.d) * .3 * devicePixelRatio;
      if (f.y > H) { f.y = -5; f.x = Math.random() * W; }
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(tick);
  };
  addEventListener("resize", resize); resize(); tick();
})();

$("year").textContent = CHRISTMAS.getFullYear();
renderChips(); render(); countdown(); setInterval(countdown, 30000);
setTimeout(() => document.body.classList.add("ready"), 1000);
</script>
</body>
</html>
